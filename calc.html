<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      body {
        background-color: #000;
      }
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
      }
      .flex {
        display: flex;
      }
      .button {
        color: #fff;
        width: 80px;
        height: 80px;
        margin: 5px;
        font-size: 24px;
        cursor: pointer;
        border-radius: 100px;
        border: none;
        padding: 15px;
        transition: all 0.3s ease;
        background-color: #eeeeee46;
      }
      .flex .button:last-child {
        background-color: #f69d19;
        color: white;
      }
      .button:hover {
        background-color: #e0e0e06e;
      }
      .flex .button:last-child:hover {
        background-color: #ff8c00;
      }
      input {
        width: 100%;
        text-align: right;
        background-color: transparent;
        border: 0;
        outline: none;
        color: white;
        font-size: 48px;
        max-width: 280px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div><input  value="0" type="text" /></div>
      <div>
        <div class="flex">
          <button class="button">
            <span style="display: none;"><-</span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.1.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path fill="#ffffff" d="M576 192C576 156.7 547.3 128 512 128L205.3 128C188.3 128 172 134.7 160 146.7L9.4 297.4C3.4 303.4 0 311.5 0 320C0 328.5 3.4 336.6 9.4 342.6L160 493.3C172 505.3 188.3 512 205.3 512L512 512C547.3 512 576 483.3 576 448L576 192zM284.1 252.1C293.5 242.7 308.7 242.7 318 252.1L351.9 286L385.8 252.1C395.2 242.7 410.4 242.7 419.7 252.1C429 261.5 429.1 276.7 419.7 286L385.8 319.9L419.7 353.8C429.1 363.2 429.1 378.4 419.7 387.7C410.3 397 395.1 397.1 385.8 387.7L351.9 353.8L318 387.7C308.6 397.1 293.4 397.1 284.1 387.7C274.8 378.3 274.7 363.1 284.1 353.8L318 319.9L284.1 286C274.7 276.6 274.7 261.4 284.1 252.1z"/></svg>
          </button>
          <button class="button">AC</button>
          <button class="button">%</button>
          <button class="button">/</button>
        </div>
        <div class="flex">
          <button class="button">7</button>
          <button class="button">8</button>
          <button class="button">9</button>
          <button class="button">*</button>
        </div>
        <div class="flex">
          <button class="button">4</button>
          <button class="button">5</button>
          <button class="button">6</button>
          <button class="button">-</button>
        </div>
        <div class="flex">
          <button class="button">1</button>
          <button class="button">2</button>
          <button class="button">3</button>
          <button class="button">+</button>
        </div>
        <div class="flex">
          <button class="button">00</button>
          <button class="button">0</button>
          <button class="button">.</button>
          <button class="button">=</button>
        </div>
      </div>
    </div>
    <script>
        const buttons = document.querySelectorAll(".button");
        const input = document.querySelector("input");
        let expression = "";
        buttons.forEach((button) => {
          button.addEventListener("click", () => {
            const value = button.textContent.trim();
            console.log(value)
    
            if (value === "AC") {
                expression = "";
                input.value = "0";
            } else if (value === "<-") {
                expression = expression.slice(0, -1);
                input.value = expression || "0";
            } else if (value === "=") {
                try {
                expression = eval(expression).toString();
                input.value = expression;
                } catch {
                input.value = "Error";
                expression = "";
                }
            } else {
                expression += value;
                input.value = expression;
            }
            });
        });
    </script>
  </body>
</html>
